# nginx serves the built front-end AND proxies /api to the API container.
#
# That second job is the important one. It means the browser only ever talks to
# ONE origin, so the session cookie is same-origin: no CORS preflight, no
# SameSite=None, no cookie silently dropped. It is exactly what Vite's dev
# proxy does, so development and the container behave identically.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # `api` is the service name in docker-compose.yml. Docker runs an internal
    # DNS server on its network, so service names resolve to container IPs —
    # this is why nothing needs to know an address in advance.
    location /api/ {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # A single-page app owns its own routing, so any path that is not a real
    # file must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever their content changes, so they can
    # be cached hard. index.html must not be, or the browser keeps serving a
    # page that points at assets which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
